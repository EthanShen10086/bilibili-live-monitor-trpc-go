name: bilibili-trpc-monitor
services:
  monitor:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    network_mode: host
    restart: unless-stopped
    init: true
    env_file: .env
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ../../trpc_go.yaml:/app/trpc_go.yaml:ro
      - monitor-state:/app/var
    mem_limit: 256m
    cpus: 0.50
    stop_grace_period: 80s
    healthcheck:
      test: [CMD, /app/monitor, --root, /app, healthcheck, live]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging: &bounded-logs
      driver: json-file
      options: {max-size: "2m", max-file: "3"}
  sender:
    profiles: [workers]
    extends:
      service: monitor
    volumes:
      - ./config.sender.yaml:/app/config.yaml:ro
      - ./trpc.sender.yaml:/app/trpc_go.yaml:ro
      - sender-state:/app/var
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    profiles: [platform]
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-state:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "max_connections=24", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 512m
    logging: *bounded-logs
  redis:
    profiles: [platform]
    image: redis:7.4.6-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-ec", 'test -n "$$REDIS_PASSWORD"; exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction']
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-state:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 192m
    logging: *bounded-logs
  nginx:
    profiles: [nginx]
    image: nginx:1.28.0-alpine
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
      - ./auth:/etc/nginx/auth:ro
    mem_limit: 128m
    cpus: 0.25
    logging: *bounded-logs
volumes:
  monitor-state:
  sender-state:
  postgres-state:
  redis-state:
