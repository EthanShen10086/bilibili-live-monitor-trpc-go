worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 128; }
http {
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/live-monitor-client;
  proxy_temp_path /tmp/live-monitor-proxy;
  client_max_body_size 8k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 15s;
  limit_req_zone $binary_remote_addr zone=status_limit:1m rate=5r/s;
  server {
    listen 443 ssl;
    server_name monitor.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "Live monitor status";
    auth_basic_user_file /etc/nginx/auth/status.htpasswd;
    location = /status {
      limit_except GET { deny all; }
      limit_req zone=status_limit burst=10 nodelay;
      proxy_pass http://127.0.0.1:19029;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
      proxy_cache off;
      proxy_next_upstream off;
      add_header Cache-Control "no-store" always;
    }
    location = /healthz {
      limit_except GET { deny all; }
      limit_req zone=status_limit burst=10 nodelay;
      proxy_pass http://127.0.0.1:19029;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
      proxy_cache off;
      proxy_next_upstream off;
    }
    location / { return 404; }
  }
}
