apisix:
  node_listen: 9080
  enable_admin: false
  ssl:
    enable: true
    listen:
      - port: 443
  enable_control: false
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
nginx_config:
  error_log: /dev/stderr
  error_log_level: warn
  http:
    client_max_body_size: 64k
    access_log: /dev/stdout
    access_log_format: '{"service":"gateway","gateway":"apisix","request_id":"$request_id","status":$status,"method":"$request_method","duration":$request_time}'
plugins:
  - forward-auth
  - proxy-rewrite
  - limit-req
  - prometheus
  - request-id
  - response-rewrite
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
