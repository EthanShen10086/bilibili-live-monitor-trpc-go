apisix:
  node_listen: 9080
  dns_resolver: [127.0.0.11]
  dns_resolver_valid: 5
  enable_ipv6: false
  enable_admin: false
  ssl:
    enable: true
    listen:
      - port: 443
  enable_control: false
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
nginx_config:
  # This Compose profile has a 384MiB budget. Multiple auto workers also keep
  # independent negative DNS caches during backend bootstrap/restarts.
  worker_processes: 1
  error_log: /dev/stderr
  error_log_level: warn
  http:
    client_max_body_size: 64k
    access_log: /dev/stdout
    access_log_format: '{"service":"gateway","gateway":"apisix","request_id":"$request_id","api_request_id":"$upstream_http_x_request_id","status":$status,"method":"$request_method","duration":$request_time}'
plugins:
  - forward-auth
  - proxy-rewrite
  - limit-req
  - prometheus
  - request-id
  - response-rewrite
plugin_attr:
  prometheus:
    export_addr:
      ip: 0.0.0.0
      port: 9091
