global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: live-platform
    static_configs:
      - targets: ['api:8800', 'detector:8800', 'relay:8800', 'router:8800', 'sender:8800', 'analytics:8800']
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix:9091']
