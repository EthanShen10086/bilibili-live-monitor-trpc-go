# Run Prometheus on the Linux host (or in host network mode), or adapt these
# loopback targets to an authenticated private scrape proxy. Never open admin.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [alerts.yaml]
scrape_configs:
  - job_name: bilibili-monitor
    static_configs:
      - targets: ['127.0.0.1:19029']
        labels: {subscription: room-1616-main}
      # Enable only if a separate sender is deployed:
      # - targets: ['127.0.0.1:19031']
      #   labels: {subscription: room-1616-main}
