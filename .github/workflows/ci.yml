name: tests
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o dist/monitor ./cmd/monitor
      - run: python3 scripts/smoke.py
